<script>
    let totalLeave = parseFloat(localStorage.getItem('totalLeave')) || 15;
    let resetDateStr = localStorage.getItem('resetDateStr') || "08-04";
    let leaveRecords = JSON.parse(localStorage.getItem('leaveRecords')) || [];
    let selectedSeasonYear = null; // 현재 선택된 시즌 시작 연도
    let editingId = null;

    document.getElementById('total-leave-input').value = totalLeave;
    document.getElementById('reset-date-input').value = resetDateStr;

    // 특정 날짜가 속한 연차 시즌(시작일~종료일) 구하기
    function getLeaveSeasonRange(targetDate = new Date()) {
        const currentYear = targetDate.getFullYear();
        const [resetMonth, resetDay] = resetDateStr.split('-').map(Number);
        
        let seasonStart = new Date(currentYear, resetMonth - 1, resetDay, 0, 0, 0, 0);
        if (targetDate < seasonStart) {
            seasonStart.setFullYear(currentYear - 1);
        }
        
        let seasonEnd = new Date(seasonStart);
        seasonEnd.setFullYear(seasonStart.getFullYear() + 1);
        seasonEnd.setDate(seasonEnd.getDate() - 1);
        seasonEnd.setHours(23, 59, 59, 999);

        return { start: seasonStart, end: seasonEnd };
    }

    // 시즌 드롭다운 셀렉트박스 생성 및 초기화
    function initSeasonSelector() {
        const today = new Date();
        const currentSeason = getLeaveSeasonRange(today);
        const currentStartYear = currentSeason.start.getFullYear();

        if (!selectedSeasonYear) {
            selectedSeasonYear = currentStartYear;
        }

        // 존재하는 모든 연차 기록의 연도 모으기
        const yearsSet = new Set([currentStartYear - 1, currentStartYear, currentStartYear + 1]);
        leaveRecords.forEach(r => {
            const rSeason = getLeaveSeasonRange(new Date(r.date));
            yearsSet.add(rSeason.start.getFullYear());
        });

        const sortedYears = Array.from(yearsSet).sort((a, b) => b - a); // 최신순 정렬

        // 텍스트 안내 영역을 시즌 선택 Dropdown으로 대체
        const seasonInfoEl = document.getElementById('current-season-text');
        
        let selectHtml = `<label for="season-select" style="font-weight:bold; margin-right:8px;">📅 조회할 연차 시즌:</label>`;
        selectHtml += `<select id="season-select" onchange="changeSeason(this.value)" style="padding:6px 12px; font-size:14px; font-weight:bold; border-color:#2563eb; color:#2563eb;">`;

        const [rMonth, rDay] = resetDateStr.split('-');
        sortedYears.forEach(y => {
            const sStart = `${y}-${rMonth}-${rDay}`;
            const endYearDate = new Date(y + 1, parseInt(rMonth) - 1, parseInt(rDay) - 1);
            const sEnd = endYearDate.toISOString().split('T')[0];
            
            const isCurrent = (y === currentStartYear) ? " (현재 시즌)" : "";
            const isSelected = (y === selectedSeasonYear) ? "selected" : "";
            
            selectHtml += `<option value="${y}" ${isSelected}>${sStart} ~ ${sEnd}${isCurrent}</option>`;
        });

        selectHtml += `</select>`;
        seasonInfoEl.innerHTML = selectHtml;
    }

    function changeSeason(year) {
        selectedSeasonYear = parseInt(year);
        updateDashboard();
        renderHistory();
    }

    function saveSettings() {
        const inputVal = parseFloat(document.getElementById('total-leave-input').value);
        const inputDate = document.getElementById('reset-date-input').value.trim();
        const dateRegex = /^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$/;

        if (isNaN(inputVal) || inputVal < 0) {
            alert('올바른 연차 개수를 입력해주세요.');
            return;
        }
        if (!dateRegex.test(inputDate)) {
            alert('입사일(리셋일)을 MM-DD 형식(예: 08-04)으로 입력해주세요.');
            return;
        }

        totalLeave = inputVal;
        resetDateStr = inputDate;
        localStorage.setItem('totalLeave', totalLeave);
        localStorage.setItem('resetDateStr', resetDateStr);
        
        selectedSeasonYear = null; // 리셋 시 시즌 재계산
        initSeasonSelector();
        saveAndReload();
    }

    // 선택된 시즌 범위 가져오기
    function getSelectedSeasonRange() {
        const [resetMonth, resetDay] = resetDateStr.split('-').map(Number);
        const start = new Date(selectedSeasonYear, resetMonth - 1, resetDay, 0, 0, 0, 0);
        const end = new Date(start);
        end.setFullYear(start.getFullYear() + 1);
        end.setDate(end.getDate() - 1);
        end.setHours(23, 59, 59, 999);
        return { start, end };
    }

    function updateDashboard() {
        const today = new Date();
        today.setHours(0,0,0,0);
        const season = getSelectedSeasonRange();

        let pastUsedLeave = 0;
        let upcomingLeave = 0;

        leaveRecords.forEach(record => {
            const recordDate = new Date(record.date);
            recordDate.setHours(0,0,0,0);

            // 선택된 시즌 범위 내의 항목만 집계
            if (recordDate >= season.start && recordDate <= season.end) {
                if (recordDate >= today) {
                    upcomingLeave += record.amount;
                } else {
                    pastUsedLeave += record.amount;
                }
            }
        });

        const currentRemain = totalLeave - pastUsedLeave;
        const finalExpectedRemain = currentRemain - upcomingLeave;

        document.getElementById('display-total').innerText = `${totalLeave}개`;
        document.getElementById('display-used').innerText = `${pastUsedLeave}개`;
        document.getElementById('display-remain').innerText = `${currentRemain}개`;
        document.getElementById('display-final').innerText = `${finalExpectedRemain}개`;
    }

    function exportData() {
        const dataObj = { totalLeave: totalLeave, resetDateStr: resetDateStr, leaveRecords: leaveRecords };
        const dataStr = JSON.stringify(dataObj, null, 2);
        const blob = new Blob([dataStr], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const todayStr = new Date().toISOString().split('T')[0];
        link.href = url;
        link.download = `leave_data_${todayStr}.txt`;
        link.click();
        URL.revokeObjectURL(url);
    }

    function processParsedData(parsedData) {
        if (parsedData.totalLeave !== undefined && parsedData.resetDateStr && Array.isArray(parsedData.leaveRecords)) {
            if (confirm("기존 연차 데이터를 지우고 새 데이터로 덮어씌우시겠습니까?")) {
                totalLeave = parsedData.totalLeave;
                resetDateStr = parsedData.resetDateStr;
                leaveRecords = parsedData.leaveRecords;

                localStorage.setItem('totalLeave', totalLeave);
                localStorage.setItem('resetDateStr', resetDateStr);
                localStorage.setItem('leaveRecords', JSON.stringify(leaveRecords));

                document.getElementById('total-leave-input').value = totalLeave;
                document.getElementById('reset-date-input').value = resetDateStr;

                initSeasonSelector();
                saveAndReload();
                alert("데이터가 완벽하게 복원되었습니다! 🎉");
                return true;
            }
        } else {
            alert("올바른 연차 데이터 형식이 아닙니다.");
        }
        return false;
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const parsedData = JSON.parse(e.target.result);
                processParsedData(parsedData);
            } catch (err) {
                alert("파일을 읽는 중 오류가 발생했습니다.");
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function importFromText() {
        const textInput = document.getElementById('mobile-text-input').value.trim();
        if (!textInput) {
            alert("복사한 백업 텍스트 내용을 먼저 입력창에 붙여넣어 주세요!");
            return;
        }
        try {
            const parsedData = JSON.parse(textInput);
            const success = processParsedData(parsedData);
            if(success) {
                document.getElementById('mobile-text-input').value = '';
            }
        } catch (err) {
            alert("텍스트 형식이 잘못되었습니다.");
        }
    }

    function addLeaveRecord() {
        const dateInput = document.getElementById('leave-date').value;
        const typeSelect = document.getElementById('leave-type');
        const typeText = typeSelect.options[typeSelect.selectedIndex].text.split(' ')[0];
        const amount = parseFloat(typeSelect.value);
        const memo = document.getElementById('leave-memo').value.trim() || '없음';

        if (!dateInput) {
            alert('날짜를 선택해 주세요.');
            return;
        }

        const newRecord = { id: Date.now(), date: dateInput, type: typeText, amount: amount, memo: memo };
        leaveRecords.push(newRecord);
        sortRecords();

        // 등록된 날짜의 시즌으로 자동 이동하여 보여주기
        const addedSeason = getLeaveSeasonRange(new Date(dateInput));
        selectedSeasonYear = addedSeason.start.getFullYear();
        initSeasonSelector();

        saveAndReload();
        document.getElementById('leave-date').value = '';
        document.getElementById('leave-memo').value = '';
    }

    function sortRecords() {
        leaveRecords.sort((a, b) => new Date(a.date) - new Date(b.date));
    }

    function saveAndReload() {
        localStorage.setItem('leaveRecords', JSON.stringify(leaveRecords));
        updateDashboard();
        renderHistory();
    }

    function deleteRecord(id) {
        if (confirm('이 연차 기록을 삭제하시겠습니까?')) {
            leaveRecords = leaveRecords.filter(record => record.id !== id);
            initSeasonSelector();
            saveAndReload();
        }
    }

    function startEdit(id) { editingId = id; renderHistory(); }
    function cancelEdit() { editingId = null; renderHistory(); }

    function saveEdit(id, isMobile = false) {
        let newDate, newTypeText, newAmount, newMemo;
        
        if(isMobile) {
            const container = document.getElementById(`m-row-${id}`);
            newDate = container.querySelector('.m-edit-date').value;
            const typeSelect = container.querySelector('.m-edit-type');
            newTypeText = typeSelect.options[typeSelect.selectedIndex].text.split(' ')[0];
            newAmount = parseFloat(typeSelect.value);
            newMemo = container.querySelector('.m-edit-memo').value.trim() || '없음';
        } else {
            const row = document.getElementById(`row-${id}`);
            newDate = row.querySelector('.edit-date').value;
            const typeSelect = row.querySelector('.edit-type');
            newTypeText = typeSelect.options[typeSelect.selectedIndex].text.split(' ')[0];
            newAmount = parseFloat(typeSelect.value);
            newMemo = row.querySelector('.edit-memo').value.trim() || '없음';
        }

        if (!newDate) {
            alert('날짜를 선택해 주세요.');
            return;
        }

        leaveRecords = leaveRecords.map(record => {
            if (record.id === id) {
                return { ...record, date: newDate, type: newTypeText, amount: newAmount, memo: newMemo };
            }
            return record;
        });

        editingId = null;
        sortRecords();
        initSeasonSelector();
        saveAndReload();
    }

    function renderHistory() {
        const upcomingTbody = document.getElementById('upcoming-tbody');
        const pastTbody = document.getElementById('past-tbody');
        upcomingTbody.innerHTML = '';
        pastTbody.innerHTML = '';

        const upcomingMobileList = document.getElementById('upcoming-mobile-list');
        const pastMobileList = document.getElementById('past-mobile-list');
        upcomingMobileList.innerHTML = '';
        pastMobileList.innerHTML = '';

        const today = new Date();
        today.setHours(0,0,0,0);
        const season = getSelectedSeasonRange();

        let upcomingCount = 0;
        let pastCount = 0;

        // 선택된 시즌에 해당하는 내역만 필터링해서 출력
        leaveRecords.forEach(record => {
            const recordDate = new Date(record.date);
            recordDate.setHours(0,0,0,0);

            // 해당 시즌에 포함되는 기록만 랜더링
            if (recordDate < season.start || recordDate > season.end) return;

            const isUpcoming = recordDate >= today;
            if (isUpcoming) upcomingCount++; else pastCount++;

            const getSelectHtml = (currentAmount, prefix="") => `
                <select class="table-input ${prefix}edit-type">
                    <option value="1" ${currentAmount === 1 ? 'selected' : ''}>종일 (1.0)</option>
                    <option value="0.5" ${currentAmount === 0.5 ? 'selected' : ''}>반차 (0.5)</option>
                    <option value="0.25" ${currentAmount === 0.25 ? 'selected' : ''}>반반차 (0.25)</option>
                </select>
            `;

            // --- PC용 테이블 뷰 ---
            const tr = document.createElement('tr');
            tr.id = `row-${record.id}`;

            if (editingId === record.id) {
                tr.innerHTML = `
                    <td><input type="date" class="table-input edit-date" value="${record.date}"></td>
                    <td>${getSelectHtml(record.amount)}</td>
                    <td>-</td>
                    <td><input type="text" class="table-input edit-memo" value="${record.memo}"></td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-success" style="padding: 4px 6px; font-size: 11px;" onclick="saveEdit(${record.id}, false)">저장</button>
                            <button style="padding: 4px 6px; font-size: 11px; background: #64748b;" onclick="cancelEdit()">취소</button>
                        </div>
                    </td>
                `;
                if (isUpcoming) upcomingTbody.appendChild(tr); 
                else pastTbody.insertBefore(tr, pastTbody.firstChild);
            } else {
                if (isUpcoming) {
                    const diffTime = recordDate - today;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    const dDayText = diffDays === 0 ? "Today" : `D-${diffDays}`;

                    tr.innerHTML = `
                        <td><b style="color: #2563eb;">${record.date}</b></td>
                        <td>${record.type}</td>
                        <td><strong>${record.amount}</strong></td>
                        <td style="text-align: left; padding-left: 10px;">
                            <span class="badge upcoming">예정</span>
                            <span class="d-day">${dDayText}</span> | ${record.memo}
                        </td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-edit" style="padding: 4px 6px; font-size: 11px;" onclick="startEdit(${record.id})">수정</button>
                                <button class="btn-danger" style="padding: 4px 6px; font-size: 11px;" onclick="deleteRecord(${record.id})">취소</button>
                            </div>
                        </td>
                    `;
                    upcomingTbody.appendChild(tr);
                } else {
                    tr.innerHTML = `
                        <td style="color: #64748b;">${record.date}</td>
                        <td>${record.type}</td>
                        <td>${record.amount}</td>
                        <td style="text-align: left; padding-left: 10px; color: #64748b;">
                            <span class="badge past">완료</span> | ${record.memo}
                        </td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-edit" style="padding: 4px 6px; font-size: 11px; opacity: 0.7;" onclick="startEdit(${record.id})">수정</button>
                                <button class="btn-danger" style="padding: 4px 6px; font-size: 11px; opacity: 0.6;" onclick="deleteRecord(${record.id})">삭제</button>
                            </div>
                        </td>
                    `;
                    pastTbody.insertBefore(tr, pastTbody.firstChild);
                }
            }

            // --- 모바일용 카드 뷰 ---
            const mDiv = document.createElement('div');
            mDiv.className = 'mobile-item-card';
            mDiv.id = `m-row-${record.id}`;

            if (editingId === record.id) {
                mDiv.innerHTML = `
                    <div class="mobile-edit-box">
                        <label style="font-size:12px; font-weight:bold;">날짜 변경</label>
                        <input type="date" class="table-input m-edit-date" value="${record.date}">
                        <label style="font-size:12px; font-weight:bold;">종류 변경</label>
                        ${getSelectHtml(record.amount, "m-")}
                        <label style="font-size:12px; font-weight:bold;">사유 변경</label>
                        <input type="text" class="table-input m-edit-memo" value="${record.memo}">
                        <div class="mobile-item-actions" style="margin-top:5px;">
                            <button class="btn-success" onclick="saveEdit(${record.id}, true)">저장</button>
                            <button style="background: #64748b;" onclick="cancelEdit()">취소</button>
                        </div>
                    </div>
                `;
                if (isUpcoming) upcomingMobileList.appendChild(mDiv);
                else pastMobileList.insertBefore(mDiv, pastMobileList.firstChild);
            } else {
                if (isUpcoming) {
                    const diffTime = recordDate - today;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    const dDayText = diffDays === 0 ? "Today" : `D-${diffDays}`;

                    mDiv.innerHTML = `
                        <div class="mobile-item-header">
                            <span class="mobile-item-date" style="color:#2563eb;">${record.date}</span>
                            <div>
                                <span class="badge upcoming">예정</span>
                                <span class="d-day">${dDayText}</span>
                            </div>
                        </div>
                        <div class="mobile-item-body">
                            📢 <b>${record.type} (${record.amount}개 차감)</b><br>
                            💬 사유: ${record.memo}
                        </div>
                        <div class="mobile-item-actions">
                            <button class="btn-edit" onclick="startEdit(${record.id})">수정</button>
                            <button class="btn-danger" onclick="deleteRecord(${record.id})">취소</button>
                        </div>
                    `;
                    upcomingMobileList.appendChild(mDiv);
                } else {
                    mDiv.innerHTML = `
                        <div class="mobile-item-header">
                            <span class="mobile-item-date" style="color:#64748b;">${record.date}</span>
                            <span class="badge past">완료</span>
                        </div>
                        <div class="mobile-item-body" style="color:#64748b;">
                            📢 <b>${record.type} (${record.amount}개 차감)</b><br>
                            💬 사유: ${record.memo}
                        </div>
                        <div class="mobile-item-actions">
                            <button class="btn-edit" style="opacity:0.8;" onclick="startEdit(${record.id})">수정</button>
                            <button class="btn-danger" style="opacity:0.7;" onclick="deleteRecord(${record.id})">삭제</button>
                        </div>
                    `;
                    pastMobileList.insertBefore(mDiv, pastMobileList.firstChild);
                }
            }
        });

        document.getElementById('no-upcoming-msg').style.display = upcomingCount === 0 ? 'block' : 'none';
        document.getElementById('no-past-msg').style.display = pastCount === 0 ? 'block' : 'none';
    }

    // 초기 실행
    initSeasonSelector();
    updateDashboard();
    renderHistory();
</script>
